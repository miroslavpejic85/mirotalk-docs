# Theme Configuration
theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: dark blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  favicon: images/icon/favicon.ico
  logo: images/logo.svg
  font:
    text: 'Manrope'
    code: 'Fira Code'
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

# Custom styles
extra_css:
  - stylesheets/extra.css?v=1.5.11
extra_javascript:
  - javascripts/accessibility.js
  - javascripts/analytics-events.js

# Social / preview card metadata
extra:
  docs_version: v1.5.11
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/miroslavpejic85
    - icon: fontawesome/brands/discord
      link: https://discord.gg/rgGYfeYW3N
  social_image: images/mirotalk-preview.png

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
      auto_title: true
      linenums: true
      line_spans: __span
      linenums_style: pymdownx-inline
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
