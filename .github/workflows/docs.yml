name: Documentation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check navigation coverage
        run: python scripts/check_nav_coverage.py

      - name: Build documentation
        run: python -m mkdocs build --strict

      - name: Check generated metadata
        run: python scripts/check_site_metadata.py

      - name: Check internal links
        run: python scripts/check_internal_links.py

      - name: Check analytics events
        run: node scripts/check_analytics_events.js