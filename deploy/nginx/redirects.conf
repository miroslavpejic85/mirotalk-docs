# Permanent compatibility redirects for established public documentation URLs.
location ~ ^/sites/([^/]+)\.html$ {
    return 301 /sites/$1/$is_args$args;
}

location = /license/licensing-options {
    return 301 /license/$is_args$args;
}

location = /license/licensing-options/ {
    return 301 /license/$is_args$args;
}
